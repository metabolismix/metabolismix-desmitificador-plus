<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mito-Bot MMX | Ciencia Real</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f9;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(0, 188, 201, 0.05) 1px, transparent 0);
      background-size: 16px 16px;
      letter-spacing: -0.018em;
      color: #003d5b;
    }

    .bg-mmx-gradient { background: linear-gradient(135deg, #00BCC9 0%, #0088A3 100%); }
    .text-mmx-gradient {
      background: linear-gradient(135deg, #00BCC9 0%, #0088A3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .text-reality { color: #10B981; }
    .text-myth { color: #960018; }
    .bg-reality { background-color: #10B981; }
    .bg-myth { background-color: #960018; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .pattern-dots {
      background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
      background-size: 8px 8px;
    }

    .active-scale:active { transform: scale(0.97); }
    textarea::placeholder { color: #cbd5e1; }

    .glow-teal { box-shadow: 0 18px 50px -25px rgba(0, 188, 201, 0.40); }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.0",
      "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";
    const html = htm.bind(React.createElement);

    // --- Iconos ---
    const CopyIcon = () => html`
      <svg className="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25" />
      </svg>
    `;

    const CheckIcon = ({ size = "h-3.5 w-3.5" } = {}) => html`
      <svg className=${size} fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    `;

    const TrashIcon = () => html`
      <svg className="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    `;

    const XIcon = ({ size = "h-3.5 w-3.5" } = {}) => html`
      <svg className=${size} fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    `;

    const ArrowIcon = () => html`
      <svg className="h-3 w-3 opacity-0 group-hover:opacity-100 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    `;

    // --- Tipos de evidencia (Gauge) ---
    const Gauge = ({ level }) => {
      const getLevelInfo = () => {
        switch (level) {
          case "Alta": return { color: "bg-reality", width: "w-full", label: "CIENCIA PURA", perc: "99%" };
          case "Moderada": return { color: "bg-sky-500", width: "w-2/3", label: "BASTANTE FIABLE", perc: "70%" };
          default: return { color: "bg-myth", width: "w-1/3", label: "MUY DUDOSO", perc: "15%" };
        }
      };
      const info = getLevelInfo();
      const textColor = info.color.replace("bg-", "text-");

      return html`
        <div className="w-full">
          <div className="flex justify-between items-end mb-1">
            <span className=${`text-[9px] font-bold ${textColor}`}>${info.label}</span>
            <span className="text-lg font-black italic text-gray-900 leading-none">${info.perc}</span>
          </div>
          <div className="h-2 w-full bg-gray-100 rounded-full overflow-hidden p-0.5 shadow-inner">
            <div className=${`h-full ${info.color} rounded-full transition-all duration-1000 ${info.width}`}></div>
          </div>
        </div>
      `;
    };

    // --- ResultCard ---
    const ResultCard = ({ result, onDelete, onRelated }) => {
      const [mode, setMode] = useState("simple");
      const [copied, setCopied] = useState(false);

      const copy = async () => {
        const text =
          `Veredicto Mito-Bot: "${result.myth}" -> Es ${result.isTrue ? "VERDAD" : "MITO"}. ` +
          (mode === "simple" ? result.explanation_simple : result.explanation_expert);

        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          alert("No puedo copiar al portapapeles en este navegador.");
        }
      };

      return html`
        <div className="w-full snap-center min-w-full px-1">
          <div className="bg-white rounded-3xl p-5 border border-white shadow-lg flex flex-col h-full relative overflow-hidden pattern-dots">
            <div className="absolute top-4 right-4 flex gap-2">
              <button onClick=${copy} className=${`p-2 rounded-lg border transition-all ${copied ? "bg-reality text-white" : "bg-white text-gray-400 hover:text-sky-500"}`}>
                ${copied ? html`<${CheckIcon} />` : html`<${CopyIcon} />`}
              </button>
              <button onClick=${() => onDelete(result.id)} className="p-2 rounded-lg bg-white text-gray-300 hover:text-myth">
                <${TrashIcon} />
              </button>
            </div>

            <div className="flex items-center gap-3 mb-4">
              <div className=${`p-2.5 rounded-xl ${result.isTrue ? "bg-[#e9f9f5] text-reality" : "bg-[#fff1f3] text-myth"}`}>
                ${result.isTrue ? html`<${CheckIcon} size="h-6 w-6" />` : html`<${XIcon} size="h-6 w-6" />`}
              </div>
              <div className="leading-none">
                <span className="text-[8px] font-bold uppercase text-gray-400 block mb-0.5">Veredicto</span>
                <div className=${`text-xl font-black italic ${result.isTrue ? "text-reality" : "text-myth"}`}>
                  ${result.isTrue ? "REALIDAD" : "MITO"}
                </div>
              </div>
            </div>

            <div className="flex-1 mb-4">
              <span className="inline-block px-2 py-0.5 rounded bg-gray-50 text-gray-400 text-[8px] font-bold uppercase border border-gray-100 mb-2">
                ${result.category}
              </span>
              <h3 className="text-lg font-black text-[#003d5b] leading-tight mb-4">"${result.myth}"</h3>

              <div className="bg-gray-100 p-0.5 rounded-xl flex gap-0.5 mb-4 max-w-[200px] border border-gray-200/50">
                <button onClick=${() => setMode("simple")} className=${`flex-1 py-1 text-[9px] font-bold rounded-lg ${mode === "simple" ? "bg-white shadow-sm" : "text-gray-400"}`}>En Cristiano</button>
                <button onClick=${() => setMode("expert")} className=${`flex-1 py-1 text-[9px] font-bold rounded-lg ${mode === "expert" ? "bg-white shadow-sm" : "text-gray-400"}`}>Para Expertos</button>
              </div>

              <p className="text-sm font-medium text-gray-700 leading-snug">
                ${mode === "simple" ? result.explanation_simple : result.explanation_expert}
              </p>
            </div>

            <div className="space-y-4">
              <${Gauge} level=${result.evidenceLevel} />

              ${Array.isArray(result.sources) && result.sources.length > 0 ? html`
                <div className="pt-3 border-t border-gray-50 flex flex-wrap gap-1">
                  ${result.sources.map((s, i) => html`
                    <span key=${i} className="text-[9px] bg-white border px-2 py-0.5 rounded-md font-bold text-gray-600">${s}</span>
                  `)}
                </div>
              ` : null}

              ${Array.isArray(result.relatedMyths) && result.relatedMyths.length > 0 ? html`
                <div className="pt-3 border-t border-gray-50 grid gap-1">
                  ${result.relatedMyths.map((m, i) => html`
                    <button key=${i} onClick=${() => onRelated(m)}
                      className="text-left text-[9px] font-bold text-gray-400 hover:text-sky-600 bg-gray-50/50 p-2 rounded-lg border border-transparent hover:border-sky-100 transition-all flex justify-between items-center group">
                      <span className="truncate">${m}</span>
                      <${ArrowIcon} />
                    </button>
                  `)}
                </div>
              ` : null}
            </div>
          </div>
        </div>
      `;
    };

    // --- App Principal ---
    const App = () => {
      const [query, setQuery] = useState("");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const carouselRef = useRef(null);

      useEffect(() => {
        try {
          const saved = localStorage.getItem("mitobot_mmx_v2");
          if (saved) setResults(JSON.parse(saved));
        } catch {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem("mitobot_mmx_v2", JSON.stringify(results));
        } catch {}
      }, [results]);

      const verify = async (text) => {
        if (!text?.trim() || loading) return;
        setLoading(true);

        try {
          const resp = await fetch("/.netlify/functions/verifymyth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
          });

          // 🔥 Diagnóstico robusto: lee texto primero (por si Netlify devuelve HTML)
          const rawText = await resp.text();
          let data;
          try {
            data = JSON.parse(rawText);
          } catch {
            throw new Error(`Function error ${resp.status}. Respuesta no JSON: ${rawText.slice(0, 220)}`);
          }

          if (!resp.ok) {
            throw new Error(data?.error || `Function error ${resp.status}`);
          }

          const payload = data?.result || data;
          const newRes = { ...payload, id: crypto.randomUUID() };

          setResults(prev => [newRes, ...prev]);
          setQuery("");

          setTimeout(() => carouselRef.current?.scrollTo({ left: 0, behavior: "smooth" }), 300);
        } catch (e) {
          alert(e?.message || "Error de conexión.");
        } finally {
          setLoading(false);
        }
      };

      const truths = results.filter(r => r.isTrue).length;
      const myths = results.filter(r => !r.isTrue).length;

      return html`
        <div className="max-w-md mx-auto px-4 pb-20 pt-4 flex flex-col h-screen overflow-hidden">
          ${loading ? html`
            <div className="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex items-center justify-center font-black animate-pulse">
              BUSCANDO CIENCIA...
            </div>
          ` : null}

          <header className="mb-4 text-center shrink-0">
            <h1 className="text-3xl font-black text-[#003d5b] tracking-tighter leading-none">
              Mito-Bot <span className="text-mmx-gradient">MMX</span>
            </h1>
            <p className="text-[9px] font-bold text-gray-400 mt-1 uppercase">
              IA Desmitificadora: Fitness, Nutrición y Salud
            </p>
          </header>

          <section className="bg-white rounded-3xl p-4 shadow-xl border border-white mb-4 shrink-0 glow-teal">
            <textarea
              value=${query}
              onChange=${(e) => setQuery(e.target.value)}
              placeholder="¿Qué has oído hoy?"
              className="w-full bg-gray-50 border-none rounded-xl p-3 text-sm font-semibold text-[#003d5b] placeholder-gray-300 focus:ring-4 focus:ring-sky-100 transition-all resize-none h-20 mb-3"
            ></textarea>

            <div className="flex gap-1.5 overflow-x-auto no-scrollbar mb-3">
              ${["Creatina", "Ayuno", "2L Agua"].map(s => html`
                <button key=${s} onClick=${() => setQuery(s)}
                  className="text-[10px] font-bold bg-gray-50 text-gray-400 px-3 py-1 rounded-full border hover:bg-sky-50 transition-all shrink-0">
                  ${s}
                </button>
              `)}
            </div>

            <button onClick=${() => verify(query)} disabled=${!query.trim() || loading}
              className="w-full bg-mmx-gradient text-white font-black uppercase py-3 rounded-xl shadow-lg active-scale text-xs flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
              <span>Verificar</span>
              <${CheckIcon} />
            </button>
          </section>

          <div ref=${carouselRef} className="flex-1 overflow-x-auto snap-x snap-mandatory no-scrollbar flex gap-4 pb-4">
            ${results.length === 0 ? html`
              <div className="w-full flex flex-col items-center justify-center opacity-20 py-10">
                <h3 className="text-sm font-black uppercase">Sin consultas</h3>
              </div>
            ` : results.map(r => html`
              <${ResultCard} key=${r.id} result=${r}
                onDelete=${(id) => setResults(prev => prev.filter(x => x.id !== id))}
                onRelated=${verify}
              />
            `)}
          </div>

          ${results.length > 0 ? html`
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 glass-panel px-6 py-2 rounded-2xl shadow-xl flex gap-6 text-[10px] font-black border border-white/50">
              <div className="flex flex-col items-center">
                <span className="text-reality text-base">${truths}</span>
                <span className="opacity-40">Verdades</span>
              </div>
              <div className="flex flex-col items-center">
                <span className="text-myth text-base">${myths}</span>
                <span className="opacity-40">Mitos</span>
              </div>
            </div>
          ` : null}
        </div>
      `;
    };

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
